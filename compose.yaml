services:
  db:
    image: postgres:16-alpine
    container_name: react-flow-2-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: react_flow_2
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - react_flow_2_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d react_flow_2"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  react_flow_2_postgres_data:
